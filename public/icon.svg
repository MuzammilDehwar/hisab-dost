<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Safe Zone Graphic (Accounting Ledger Notebook + Rupee Symbol + Checkmark) -->
  <g transform="translate(64, 64)">
    <!-- Ledger Book Body -->
    <rect x="36" y="24" width="312" height="336" rx="24" fill="#ffffff" filter="drop-shadow(0 16px 24px rgba(0,0,0,0.2))"/>
    
    <!-- Ledger spine & rings -->
    <rect x="36" y="24" width="48" height="336" rx="8" fill="#e2e8f0"/>
    <circle cx="60" cy="80" r="10" fill="#065f46"/>
    <circle cx="60" cy="144" r="10" fill="#065f46"/>
    <circle cx="60" cy="208" r="10" fill="#065f46"/>
    <circle cx="60" cy="272" r="10" fill="#065f46"/>
    
    <!-- Ledger Lines -->
    <rect x="110" y="76" width="200" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="110" y="112" width="160" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="110" y="140" width="180" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="110" y="168" width="140" height="10" rx="5" fill="#e2e8f0"/>
    
    <!-- Gold Coin / Pakistani Rupee (₨) Badge -->
    <circle cx="270" cy="260" r="68" fill="url(#goldGrad)" filter="drop-shadow(0 8px 16px rgba(217,119,6,0.4))"/>
    <circle cx="270" cy="260" r="58" fill="none" stroke="#fef3c7" stroke-width="4" stroke-dasharray="8 6"/>
    
    <!-- Urdu/English Rs Symbol -->
    <text x="270" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">₨</text>
    
    <!-- Checkmark badge (Accurate accounting) -->
    <circle cx="120" cy="270" r="28" fill="#10b981"/>
    <path d="M108 270 L116 278 L132 262" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
