name: Build Hisab Dost Android App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_DIR: android-twa

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hisabdost-upload.keystore"

      - name: Create Gradle signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          cat > "$ANDROID_DIR/keystore.properties" <<EOF_PROPERTIES
          storeFile=$RUNNER_TEMP/hisabdost-upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF_PROPERTIES

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release bundle
        working-directory: android-twa
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: hisab-dost-release-aab
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
